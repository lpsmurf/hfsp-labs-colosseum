server {
    listen 80;
    server_name feed.xstocks.hfsp.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name feed.xstocks.hfsp.cloud;

    ssl_certificate     /etc/letsencrypt/live/feed.xstocks.hfsp.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feed.xstocks.hfsp.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    access_log /var/log/nginx/xstocks-feed-access.log;
    error_log /var/log/nginx/xstocks-feed-error.log warn;

    location / {
        proxy_pass         http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
