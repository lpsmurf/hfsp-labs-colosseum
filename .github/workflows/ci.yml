name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        run: >-
          gitleaks git --redact
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
      - name: Scan repository
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=packages/x402-common
      - run: npm run typecheck --workspaces --if-present

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=packages/x402-common
      - run: npm run lint --workspaces --if-present

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=packages/x402-common
      - run: npm run test --workspaces --if-present

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    strategy:
      fail-fast: false
      matrix:
        package:
          - x402-vpn-vps
          - x402-audit-api
          - x402-wallet
          - trial-api
          - trial-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=packages/x402-common
      - name: Build ${{ matrix.package }}
        run: npm run build --workspace=packages/${{ matrix.package }} --if-present
