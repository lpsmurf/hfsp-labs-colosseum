server {
    listen 80;
    server_name vpn.hfsp.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vpn.hfsp.cloud;

    ssl_certificate     /etc/letsencrypt/live/vpn.hfsp.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.hfsp.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # No access log — privacy
    access_log off;
    error_log /var/log/nginx/vpn-x402-error.log warn;

    # Backend API
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP "";          # strip IP
        proxy_set_header   X-Forwarded-For "";    # strip IP
        proxy_set_header   X-Forwarded-Proto "";  # strip
        proxy_read_timeout 30s;
    }

    location /.well-known/x402.json {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /health {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}
